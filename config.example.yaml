# Copia este fichero a config.yaml y rellena tus valores.
# config.yaml está en .gitignore porque contiene el token secreto.

# Base del backend de claude-test (sin barra final).
api_base: "https://tu-backend.onrender.com"

# Token de ingesta de máquina. Cópialo desde la pestaña "Stream" de claude-test.
ingest_token: "00000000-0000-0000-0000-000000000000"

# Perfil de juego a usar (fichero en pvo/profiles/<profile>.yaml).
profile: "gba_emerald"

# Cada cuántos segundos publicar como máximo (debounce de red).
publish_min_interval_s: 1.0
