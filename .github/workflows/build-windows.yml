name: Build Windows executable

# Compila el .exe en un runner Windows real (PyInstaller no hace cross-compile
# desde Linux). Se ejecuta a mano o al publicar un tag vX.Y.Z.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Ensure assets dir exists
        # Los assets (templates/embeddings) son específicos del render del usuario y
        # no van en el repo; se crea vacío para que --add-data no falle.
        shell: pwsh
        run: if (!(Test-Path assets)) { New-Item -ItemType Directory -Path assets | Out-Null }

      - name: Build with PyInstaller
        # --onedir (no --onefile): evita re-extraer ~1-2 GB de torch a /temp en cada
        # arranque (eso ralentizaba el PC). Se distribuye como carpeta comprimida.
        run: >
          pyinstaller --onedir --noconfirm --name poke-overlay
          --collect-all easyocr
          --collect-all torch
          --collect-all torchvision
          --add-data "pvo/profiles;pvo/profiles"
          --add-data "assets;assets"
          run.py

      - name: Stage release files
        shell: pwsh
        run: |
          Copy-Item config.example.yaml dist/poke-overlay/
          Copy-Item README.md dist/poke-overlay/

      # Sube la CARPETA (GitHub la comprime una sola vez → al descargar es un único
      # zip con la app dentro, sin doble compresión).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poke-overlay-windows
          path: dist/poke-overlay
          if-no-files-found: error

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/poke-overlay/* -DestinationPath poke-overlay-windows.zip -Force

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: poke-overlay-windows.zip
