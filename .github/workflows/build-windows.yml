name: Build Windows executable

# Compila el .exe en un runner Windows real (PyInstaller no hace cross-compile
# desde Linux). Se ejecuta a mano o al publicar un tag vX.Y.Z.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build with PyInstaller
        # --onefile: sin OCR neural ni OpenCV el binario son unos pocos MB, así que un
        # único .exe es lo más cómodo de distribuir. El punto de entrada es run.py (no
        # pvo/main.py, que como script suelto rompería los imports relativos).
        # No hay --add-data: la app ya no usa perfiles ni galerías de iconos.
        run: pyinstaller --onefile --noconfirm --name poke-overlay run.py

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/poke-overlay.exe release/
          Copy-Item config.example.yaml release/
          Copy-Item README.md release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poke-overlay-windows
          path: release
          if-no-files-found: error

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath poke-overlay-windows.zip -Force

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: poke-overlay-windows.zip
