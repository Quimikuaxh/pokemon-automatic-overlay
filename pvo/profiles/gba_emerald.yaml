# Perfil de Pokémon Esmeralda (GBA). Coordenadas de los slots medidas sobre un
# fotograma real del menú de equipo (240x160). Ajusta window_title_match/viewport a
# tu emulador. Las regiones son [x, y, w, h] en la resolución de referencia.

profile: gba_emerald
reference_resolution: [240, 160]   # resolución nativa GBA

capture:
  window_title_match: "mGBA"       # o usa 'region: [x, y, w, h]' para una zona fija
  fps: 3
  viewport: auto                   # 'auto' detecta el área de juego; o pon [x,y,w,h]
  aspect_ratio: 1.5                # GBA = 3:2; ayuda a quitar letterbox residual

menu_detector:
  template: ../../assets/templates/gba_emerald/party_menu.png
  region: [0, 0, 240, 160]         # zona donde buscar el template del menú
  min_confidence: 0.85
  stable_frames: 3

# 6 slots: slot 1 en el panel grande de la izquierda; 2-6 en la columna derecha.
slots:
  - { icon_region: [1, 27, 32, 32],   text_region: [34, 38, 64, 12] }
  - { icon_region: [84, 8, 32, 32],   text_region: [118, 14, 72, 12] }
  - { icon_region: [84, 34, 32, 32],  text_region: [118, 40, 72, 12] }
  - { icon_region: [84, 60, 32, 32],  text_region: [118, 66, 72, 12] }
  - { icon_region: [84, 85, 32, 32],  text_region: [118, 91, 72, 12] }
  - { icon_region: [84, 109, 32, 32], text_region: [118, 115, 72, 12] }

species:
  # Plantillas de iconos de menú de la generación 3 (Bulbagarden).
  gallery: ../../assets/icons/gen3/templates.npz
  min_similarity: 0.45

ocr:
  engine: easyocr
  lang: es
