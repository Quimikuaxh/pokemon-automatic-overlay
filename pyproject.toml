[project]
name = "pokemon-vision-overlay"
version = "0.1.0"
description = "Lee el equipo Pokémon de un emulador por visión y lo publica en el overlay público de claude-test."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["pvo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
