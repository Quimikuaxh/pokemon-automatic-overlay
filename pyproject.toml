[project]
name = "pokemon-vision-overlay"
version = "0.2.0"
description = "Agente que lee el equipo Pokemon del emulador (partida guardada o memoria) y lo publica en el overlay de claude-test."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
poke-overlay = "pvo.main:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["pvo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
